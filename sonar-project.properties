# Required metadata
sonar.projectKey=crypto-accept-test
sonar.projectName=crypto-accept-test
sonar.projectVersion=1.0

# Comma-separated paths to directories to be analyzed
sonar.sources=app,resources/js

# Comma-separated paths to directories with tests
#sonar.tests=tests

# Language-specific settings
sonar.language=php,js

# Set the encoding of the source files
sonar.sourceEncoding=UTF-8

# PHP settings
sonar.php.file.suffixes=php

# JavaScript settings (Vue.js files will be processed as JavaScript)
sonar.javascript.file.suffixes=js,vue

# Optional: Exclusions (if you want to exclude specific files/folders)
# sonar.exclusions=vendor/**,node_modules/**